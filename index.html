```html
<div class="comment-box">

  <div class="comment-title">
    <strong>Ajouter un commentaire</strong>
    <small>Votre commentaire sera transmis à Carré Coté</small>
  </div>

  <form action="https://formsubmit.co/chantier@carrecote.com" method="POST">

    <!-- Sujet du mail -->
    <input type="hidden" name="_subject" value="Nouveau commentaire – Carré Coté">

    <!-- Désactive la page de remerciement par défaut : à modifier plus tard -->
    <input type="hidden" name="_captcha" value="false">

    <!-- Champ commentaire -->
    <textarea
      name="commentaire"
      placeholder="Saisissez votre commentaire..."
      required
    ></textarea>

    <button type="submit">
      Envoyer
    </button>

  </form>

</div>

<style>
.comment-box {
  width: 100%;
  max-width: 500px;
  padding: 20px;
  background: #ffffff;
  border: 1px solid #e1e1e1;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

.comment-title {
  margin-bottom: 15px;
}

.comment-title strong {
  display: block;
  font-size: 16px;
  color: #333;
}

.comment-title small {
  display: block;
  margin-top: 4px;
  color: #888;
  font-size: 12px;
}

.comment-box textarea {
  width: 100%;
  min-height: 130px;
  padding: 13px;
  border: 1px solid #d5d5d5;
  border-radius: 8px;
  resize: vertical;
  box-sizing: border-box;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  outline: none;
}

.comment-box textarea:focus {
  border-color: #999;
}

.comment-box button {
  margin-top: 12px;
  border: none;
  background: #222;
  color: white;
  padding: 10px 22px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

.comment-box button:hover {
  background: #444;
}
</style>
